plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'


// Clé de signature de production (clé d'UPLOAD pour Play App Signing), décrite dans android/key.properties.
// Ce fichier et le keystore ne sont jamais commités (.gitignore). Procédure : README, section Publication Android.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { keystoreProperties.load(it) }
}

android {
    namespace "fr.winafoot.app"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"


    compileOptions {
        coreLibraryDesugaringEnabled =  true
        sourceCompatibility =  JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
      
        applicationId "fr.winafoot.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 36
        multiDexEnabled =  true
        versionCode =  flutterVersionCode.toInteger()
        versionName =  flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Avec key.properties : clé de production. Sans : clé debug, réservée à un APK de test local
            // (`flutter run --release`). Un AAB, seul format accepté par le Play Store, ne sort JAMAIS
            // signé avec la clé debug : voir la garde ci-dessous.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Garde de release, évaluée une fois le graphe de tâches connu : elle ne gêne ni `flutter run` en debug
// ni un APK de test local, mais refuse un artefact destiné au store signé avec une mauvaise clé.
// La première clé qui signe un AAB envoyé à la Play Console devient la clé d'upload de l'app, de façon
// quasi définitive : mieux vaut un échec de build qu'un mauvais premier envoi.
gradle.taskGraph.whenReady { graph ->
    // « Build > Generate Signed Bundle » d'Android Studio injecte lui-même la clé : rien à contrôler ici.
    if (project.hasProperty('android.injected.signing.store.file')) return

    def releaseTasks = graph.allTasks.findAll {
        it.project == project && it.name in ['bundleRelease', 'signReleaseBundle', 'assembleRelease']
    }
    if (releaseTasks.isEmpty()) return

    if (!hasReleaseKeystore) {
        // `logger.quiet` : `flutter build` lance Gradle en -q, qui masque les avertissements ordinaires.
        logger.quiet("ATTENTION : android/key.properties est absent, la release est signée avec la clé DEBUG. " +
            "Test local uniquement : ne la distribuez pas (README, section Publication Android).")
        // signReleaseBundle : l'AAB est signé par cette tâche, bundleRelease n'est qu'une tâche d'ancrage.
        if (releaseTasks.any { it.name in ['bundleRelease', 'signReleaseBundle'] }) {
            throw new GradleException(
                "android/key.properties est introuvable : un AAB signé avec la clé debug serait refusé par le Play Store " +
                "(et ne pourrait pas servir à Play Integrity). Créez la clé d'upload et key.properties : README, section Publication Android")
        }
        return
    }

    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProperties[it] }
    if (!missing.isEmpty()) {
        throw new GradleException("android/key.properties est incomplet, il manque : ${missing.join(', ')} (voir android/key.properties.example)")
    }
    if (!file(keystoreProperties['storeFile']).exists()) {
        throw new GradleException("android/key.properties : le keystore ${keystoreProperties['storeFile']} est introuvable " +
            "(chemin absolu, sans ~, sans guillemets ni espace final ; un chemin relatif part de android/app)")
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.0.21"
}
